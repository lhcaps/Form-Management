name: CI

on:
  push:
  pull_request:

# Explicit least-privilege permissions for the GITHUB_TOKEN. Without this
# block, GitHub Actions runs on private/org repos that default to
# "Read repository contents only" produce empty check-runs, no jobs and
# immediate failure (the symptom we hit on 865c69bf and the 9 runs before
# it). The two jobs in this workflow only read the repo and run pnpm
# scripts, so read-all is sufficient.
permissions:
  contents: read

jobs:
  static-verification:
    name: Static verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: API tests
        run: pnpm --filter api test --runInBand

      - name: Runtime hardcode audit
        run: pnpm audit:hardcode

      - name: Template audit
        run: pnpm audit:templates

      - name: Encoding audit
        run: pnpm audit:encoding

      - name: DOCX contract tests
        run: node --test test/docx-contract/*.test.mjs

      - name: BM-001 shared renderer smoke
        run: pnpm smoke:bm001-shadow-render

      - name: DOCX prelock guard (informational — generic draft forms)
        run: pnpm audit:docx:prelock || true

      - name: Regenerate locked-contracts verify report
        run: pnpm audit:docx:verify-locked

      - name: "Gate: 213 forms corpus readiness"
        run: pnpm gate:forms:213 --allow-remediation --allow-source-unknown --allow-unresolved-review

      - name: "Gate: Locked↔compiled consistency (C3)"
        run: pnpm audit:locked-compiled:strict

      - name: "Gate: Contract sync (C2)"
        run: pnpm audit:contract-sync

  docker-production-build:
    name: Docker production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production env
        run: |
          cp .env.docker.example .env.docker
          cat >> .env.docker <<'ENV'
          AUTH_COOKIE_SECURE=true
          SEED_ADMIN_PASSWORD=ci-not-admin123
          API_CORS_ORIGIN=http://localhost:3000
          ENV

      - name: Build production stack
        run: docker compose --env-file .env.docker -f docker-compose.prod.yml build --no-cache
