name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Explicit least-privilege permissions for the GITHUB_TOKEN. Without this
# block, GitHub Actions runs on private/org repos that default to
# "Read repository contents only" produce empty check-runs, no jobs and
# immediate failure (the symptom we hit on 865c69bf and the 9 runs before
# it). The two jobs in this workflow only read the repo and run pnpm
# scripts, so read-all is sufficient.
permissions:
  contents: read

env:
  CI: "true"

jobs:
  static-verification:
    name: Static verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic CI verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/audit/infrastructure-modernization
          pnpm verify:ci 2>&1 | tee docs/audit/infrastructure-modernization/ci-static-verification.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-verification-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            docs/audit/infrastructure-modernization/ci-static-verification.log
            docs/audit/docx-slot-inventory/latest.json
            docs/audit/docx-slot-inventory/latest.md
            docs/audit/form-status/status-matrix-213.json
            docs/audit/form-status/status-matrix-213.md

  migration-regression-gate:
    name: Fresh MariaDB migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration regression gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/migration-regression-gate
          node scripts/audit/migration-regression-gate.mjs \
            --output-dir .artifacts/migration-regression-gate \
            2>&1 | tee .artifacts/migration-regression-gate/run.log

      - name: Upload migration gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-regression-gate-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .artifacts/migration-regression-gate/

  docker-production-build:
    name: Docker production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare production env
        run: |
          cp .env.docker.example .env.docker
          cat >> .env.docker <<'ENV'
          AUTH_COOKIE_SECURE=true
          SEED_ADMIN_PASSWORD=ci-not-admin123
          API_CORS_ORIGIN=http://localhost:3000
          WEB_ORIGIN=http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY=sk_test_cHJvYmUtb25seQ
          CLERK_WEBHOOK_SECRET=whsec_ci-only
          ENV

      - name: Build and probe production images
        shell: bash
        env:
          QLLAW_DOCKER_VERIFY_ENV: .env.docker
        run: |
          set -o pipefail
          mkdir -p .artifacts
          pnpm docker:verify -- --build 2>&1 | tee .artifacts/docker-verification.log

      - name: Upload Docker verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .artifacts/docker-verification.log
