name: Production Docker probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Fresh production Docker proof
    runs-on: self-hosted
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify licensed font mount is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.QLLAW_TNR_FONT_DIR }}"
          test -d "${{ vars.QLLAW_TNR_FONT_DIR }}"
          test -r "${{ vars.QLLAW_TNR_FONT_DIR }}"

      - name: Run isolated production probe
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          QLLAW_TNR_FONT_DIR: ${{ vars.QLLAW_TNR_FONT_DIR }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          API_CORS_ORIGIN: ${{ vars.API_CORS_ORIGIN }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          WEB_PORT: ${{ vars.WEB_PORT }}
        run: |
          set -euo pipefail
          run_id="production-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_file="$(mktemp)"
          cleanup() {
            docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' \
            "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
            "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" "CLERK_WEBHOOK_SECRET=$CLERK_WEBHOOK_SECRET" \
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            "SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD" "QLLAW_TNR_FONT_DIR=$QLLAW_TNR_FONT_DIR" \
            "WEB_ORIGIN=$WEB_ORIGIN" "API_CORS_ORIGIN=$API_CORS_ORIGIN" \
            "MYSQL_DATABASE=$MYSQL_DATABASE" "MYSQL_USER=$MYSQL_USER" \
            "MYSQL_PORT=$MYSQL_PORT" "API_PORT=$API_PORT" "WEB_PORT=$WEB_PORT" > "$env_file"
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml config --quiet
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml build
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml --profile bootstrap run --rm contract-bootstrap
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml up -d
          for _ in $(seq 1 60); do curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/api/v1/ready" && break; sleep 2; done
          curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/healthz"
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml restart api
          for _ in $(seq 1 60); do curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/api/v1/ready" && break; sleep 2; done
          docker compose --project-name "$run_id" --env-file "$env_file" -f docker-compose.prod.yml exec -T mariadb mariadb -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -e 'SELECT migration_name, finished_at FROM _prisma_migrations WHERE finished_at IS NULL;' | (! grep -v '^migration_name')
