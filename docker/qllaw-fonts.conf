<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Phase 8C.1 — expose the operator-provided Times New Roman bind mount to
  fontconfig so soffice can resolve the family inside the container.

  This drop-in only ADDS a directory to fontconfig's search list. It does
  NOT copy or embed any font binary. The actual TTF bytes must come from
  the operator-provided bind mount at $QLLAW_CONTAINER_TNR_FONT_DIR.
-->
<fontconfig>
  <dir>/opt/qllaw/fonts/times-new-roman</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>