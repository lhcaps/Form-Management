name: quanlyvks-dev
# Dev only: chỉ khởi động MariaDB.
# API và Web chạy local bằng pnpm để tận dụng hot-reload.
#
# Lệnh:
#   pnpm db:up / pnpm dev:infra:up
#   pnpm db:down / pnpm dev:infra:down
#   pnpm db:logs / pnpm dev:infra:logs
#
# container_name: Sử dụng ${MARIADB_CONTAINER:-quanlyvks-mariadb} để tránh collision
# khi chạy nhiều dự án song song. Scripts backup/exec phải dùng:
#   docker compose -f infra/docker-compose.dev.yml exec -T mariadb ...
# Không hard-code tên container trong scripts.
#
# restart policy: "no" — MariaDB KHÔNG tự restart khi Docker daemon hoặc máy tính
# khởi động lại. Người dùng phải chạy `pnpm dev:infra:up` hoặc `pnpm dev` một cách
# có chủ đích. Điều này ngăn MariaDB chiếm tài nguyên khi người dùng không làm việc.
# Nếu muốn tự động restart khi crash (không khi reboot), dùng restart: on-failure.

services:
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11}
    # container_name intentionally omitted — use Compose service identity instead.
    # All scripts must use:
    #   docker compose -f infra/docker-compose.dev.yml [exec|logs|ps] mariadb
    # Project name is set by QLLAW_DEV_COMPOSE_PROJECT or derived from the repo
    # root path to avoid collision between two worktrees on the same machine.
    # Deliberate policy: "no" prevents auto-start on machine reboot.
    # User must run `pnpm dev:infra:up` explicitly.
    restart: "no"
    # Office-lite resource ceiling — keeps MariaDB from dominating the dev machine.
    # Benchmark target (OFFICE_8GB): MariaDB idle ~134 MiB → allow up to 512m.
    cpus: "${MARIADB_DEV_CPU_LIMIT:-0.75}"
    mem_limit: "${MARIADB_DEV_MEM_LIMIT:-512m}"
    pids_limit: ${MARIADB_DEV_PIDS_LIMIT:-128}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root-change-me}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-quanlyvks}
      MARIADB_USER: ${MARIADB_USER:-quanlyvks}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-me}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Note: --default-authentication-plugin removed — deprecated in MariaDB 10.4+,
      # has no effect in MariaDB 11 and generates a startup warning (RC-006).
    ports:
      - "${MARIADB_HOST_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/001_init_utf8mb4.sql:/docker-entrypoint-initdb.d/001_init_utf8mb4.sql:ro
      # Office-lite MariaDB tuning (RC-009). Mount only when the file exists.
      - ./infra/mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  mariadb_data:
